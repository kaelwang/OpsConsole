# =============================================================================
# OpsConsole Frontend - nginx (SPA fallback + /api reverse proxy)
# -----------------------------------------------------------------------------
# - Serves the Vite build from /usr/share/nginx/html.
# - History-API (SPA) fallback: unknown paths return index.html.
# - Proxies /api to the backend Kubernetes Service "opsconsole-backend:8080".
#   WebSocket upgrade headers are forwarded so /api/v1/logging/tail and
#   /api/v1/infrastructure/clusters/{id}/exec work through the same origin.
# - Listen on 8080 (unprivileged) so the container can run as non-root.
# =============================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for client-side routes (deep links, refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to backend. VITE_API_BASE=/api/v1 makes the browser call
    # same-origin /api, which is forwarded here to the backend service.
    location /api/ {
        proxy_pass http://opsconsole-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (log tail / pod exec)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Generous timeouts for streaming/tailing endpoints
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
