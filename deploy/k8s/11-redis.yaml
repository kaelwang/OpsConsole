# 11-redis.yaml
# Redis 7.2：会话（refresh token）/ 限流 / WebSocket PubSub。
apiVersion: v1
kind: Service
metadata:
  name: opsconsole-redis
  namespace: opsconsole
  labels: { app: opsconsole-redis }
spec:
  selector: { app: opsconsole-redis }
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsconsole-redis
  namespace: opsconsole
  labels: { app: opsconsole-redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: opsconsole-redis }
  template:
    metadata:
      labels: { app: opsconsole-redis }
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opsconsole-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opsconsole-redis-data
  namespace: opsconsole
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: opsconsole-longhorn
  resources:
    requests:
      storage: 2Gi
