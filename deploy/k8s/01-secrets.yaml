# 01-secrets.yaml
# 敏感配置。⚠️ 这里用的是示例弱口令，生产前务必改成强随机值。
#
# 键名必须与后端 config 读取的 env 名一致（后端只认 OPS_ 前缀，见
# backend/internal/config/config.go）：
#   OPS_DATABASE_URL / OPS_REDIS_URL / OPS_JWT_SECRET / OPS_OPENSEARCH_URL
# 另外保留 db-password 供 Postgres 容器通过 secretKeyRef 读取，
# 它与 OPS_DATABASE_URL 内的密码必须相同。
#
# 也可以用命令直接生成 Secret（避免明文落盘），见 README 步骤 1。
apiVersion: v1
kind: Secret
metadata:
  name: opsconsole-secrets
  namespace: opsconsole
type: Opaque
stringData:
  # 数据库密码单一来源：db-password 供 Postgres 容器用 secretKeyRef 读取；
  # OPS_DATABASE_URL 是后端真正读取的连接串，两者密码部分必须相同。
  db-password: "postgres-dev"
  OPS_DATABASE_URL: "postgres://postgres:postgres-dev@opsconsole-postgres:5432/opsconsole?sslmode=disable"
  OPS_REDIS_URL: "redis://opsconsole-redis:6379/0"
  OPS_JWT_SECRET: "change-me-to-a-long-random-string"
  OPS_OPENSEARCH_URL: "http://opsconsole-opensearch:9200"
