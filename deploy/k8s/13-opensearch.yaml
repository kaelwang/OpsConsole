# 13-opensearch.yaml  ⚠️ 可选 / 较重
# OpenSearch 2.17（日志全文检索 + IK 中文分词）。内存占用较大（建议 ≥1.5Gi）。
# 若只验证监控/告警，可先不部署本文件，并把 01-secrets 里的 os-url 留空——
# 后端会在日志类接口优雅返回 502，不影响其它功能。
#
# 生产建议：安装 analysis-ik 插件（见 docker-compose.yml 中的注释命令）。
apiVersion: v1
kind: Service
metadata:
  name: opsconsole-opensearch
  namespace: opsconsole
  labels: { app: opsconsole-opensearch }
spec:
  selector: { app: opsconsole-opensearch }
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: metrics
      port: 9600
      targetPort: 9600
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opsconsole-opensearch
  namespace: opsconsole
  labels: { app: opsconsole-opensearch }
spec:
  serviceName: opsconsole-opensearch
  replicas: 1
  selector:
    matchLabels: { app: opsconsole-opensearch }
  template:
    metadata:
      labels: { app: opsconsole-opensearch }
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.0
          ports:
            - containerPort: 9200
            - containerPort: 9600
          env:
            - name: discovery.type
              value: "single-node"
            - name: bootstrap.memory_lock
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "500m", memory: "1.5Gi" }
            limits:   { cpu: "2",    memory: "2Gi" }
          securityContext:
            # memlock 需要提权
            capabilities: { add: ["IPC_LOCK"] }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opsconsole-os-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opsconsole-os-data
  namespace: opsconsole
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: opsconsole-longhorn
  resources:
    requests:
      storage: 20Gi
