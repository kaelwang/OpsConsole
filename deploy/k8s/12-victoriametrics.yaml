# 12-victoriametrics.yaml
# VictoriaMetrics v1.101.0（与本地验证版本一致，避免 label_filters 等行为差异）。
# 单实例即可支撑开发/验证；生产可换 vmcluster。
apiVersion: v1
kind: Service
metadata:
  name: opsconsole-victoriametrics
  namespace: opsconsole
  labels: { app: opsconsole-victoriametrics }
spec:
  selector: { app: opsconsole-victoriametrics }
  ports:
    - name: http
      port: 8428
      targetPort: 8428
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsconsole-victoriametrics
  namespace: opsconsole
  labels: { app: opsconsole-victoriametrics }
spec:
  replicas: 1
  selector:
    matchLabels: { app: opsconsole-victoriametrics }
  template:
    metadata:
      labels: { app: opsconsole-victoriametrics }
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.101.0
          args:
            - "--storageDataPath=/victoria-metrics-data"
            - "--retentionPeriod=30"
            - "--httpListenAddr=:8428"
          ports:
            - containerPort: 8428
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "2Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opsconsole-vm-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opsconsole-vm-data
  namespace: opsconsole
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: opsconsole-longhorn
  resources:
    requests:
      storage: 20Gi
