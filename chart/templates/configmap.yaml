apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsconsole.fullname" . }}-backend-env
  labels:
    {{- include "opsconsole.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  OPS_PORT: {{ .Values.backend.port | quote }}
  OPS_REPOSITORY_MODE: {{ .Values.backend.env.OPS_REPOSITORY_MODE | quote }}
  OPS_REDIS_URL: {{ .Values.backend.env.OPS_REDIS_URL | quote }}
  OPS_VICTORIAMETRICS_URL: {{ .Values.backend.env.OPS_VICTORIAMETRICS_URL | quote }}
  OPS_OPENSEARCH_URL: {{ .Values.backend.env.OPS_OPENSEARCH_URL | quote }}
  OPS_GITLAB_BASE_URL: {{ .Values.backend.env.OPS_GITLAB_BASE_URL | quote }}
