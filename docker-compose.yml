# =============================================================================
# 企业运维控制台 (OpsConsole) — 开发单节点编排 (MVP)
# -----------------------------------------------------------------------------
# 用途：本地开发依赖一键拉起，非生产环境。
# 组件：PostgreSQL 16（主数据 + RLS 多租户）/ Redis 7.2（会话：refresh token 存储）/
#        VictoriaMetrics v1.101（时序指标）/ OpenSearch 2.17（日志全文检索 + IK 分词）。
# 启动：docker compose up -d
# 停止：docker compose down          （保留数据卷）
# 重置：docker compose down -v       （清空数据）
# 初始化：pg 首次启动自动执行挂载的 ./schema.sql（建表 / RLS / 角色预置）。
# 后端/前端不在本编排内，按 SPEC §12 本地 `go run` / `vite` 启动。
# =============================================================================

services:
  # ---------------- PostgreSQL 16（主数据 + RLS 多租户） ----------------
  pg:
    image: postgres:16-alpine
    container_name: opsconsole-pg
    environment:
      POSTGRES_DB: opsconsole
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev   # 仅开发用，生产改用密钥
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro   # PG 初始化脚本挂载
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro       # 真实种子数据（幂等）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsconsole"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [opsconsole-net]

  # ---------------- Redis 7.2（会话 / 限流 / WebSocket PubSub） ----------------
  redis:
    image: redis:7.2-alpine
    container_name: opsconsole-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [opsconsole-net]

  # ---------------- VictoriaMetrics v1.101（时序指标，PromQL 兼容） ----------------
  # 注意：victoria-metrics 镜像为 distroless，无 shell/curl，故不配置 CMD-SHELL 健康检查。
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.101.0
    container_name: opsconsole-vm
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=30"          # 保留 30 天（开发）
      - "--httpListenAddr=:8428"
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    networks: [opsconsole-net]

  # ---------------- OpenSearch 2.17（日志全文检索 + analysis-ik 中文分词） ----------------
  # 镜像说明：使用社区预构建、已内置 analysis-ik 中文分词插件的 OpenSearch 2.17 镜像。
  #   若该镜像在目标环境不可用，请改为官方基础镜像并手动安装 IK 插件：
  #     image: opensearch-project/opensearch:2.17.0
  #     启动后执行：
  #       docker exec opsconsole-os bin/opensearch-plugin install --batch \
  #         https://github.com/infinilabs/analysis-ik/releases/download/v2.17.0/analysis-ik-2.17.0.zip
  opensearch:
    image: medcl/opensearch-ik:2.17.0
    container_name: opsconsole-os
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"        # 开发单节点关闭安全插件（无鉴权）
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      - "9200:9200"
      - "9600:9600"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [opsconsole-net]

  # ---------------- node_exporter v1.8.2（主机指标采集，供 vmagent 抓取） ----------------
  nodeexporter:
    image: prom/node-exporter:v1.8.2
    container_name: opsconsole-nodeexporter
    command:
      - "--path.rootfs=/"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [opsconsole-net]

  # ---------------- vmagent v1.101（抓取 exporter 并 remote_write 到 VictoriaMetrics） ----------------
  vmagent:
    image: victoriametrics/vmagent:v1.101.0
    container_name: opsconsole-vmagent
    depends_on:
      - victoriametrics
      - nodeexporter
    command:
      - "--promscrape.config=/etc/vmagent.yml"
      - "--remoteWrite.url=http://opsconsole-vm:8428/api/v1/write"
    volumes:
      - ./deploy/vmagent.yml:/etc/vmagent.yml:ro
    networks: [opsconsole-net]

  # ---------------- vmalert v1.101（评估告警规则，数据源 VictoriaMetrics） ----------------
  # 活跃告警通过 /api/v1/alerts 暴露，由后端 monitoring 模块透传给前端。
  vmalert:
    image: victoriametrics/vmalert:v1.101.0
    container_name: opsconsole-vmalert
    depends_on:
      - victoriametrics
    command:
      - "--datasource.url=http://opsconsole-vm:8428"
      - "--remoteWrite.url=http://opsconsole-vm:8428/api/v1/write"
      - "--rule=/etc/vmalert-rules.yml"
      - "--notifier.blackhole"
      - "--httpListenAddr=:8080"
    volumes:
      - ./deploy/vmalert-rules.yml:/etc/vmalert-rules.yml:ro
    ports:
      - "8081:8080"
    networks: [opsconsole-net]

volumes:
  pg-data:
  redis-data:
  vm-data:
  os-data:

networks:
  opsconsole-net:
    driver: bridge
